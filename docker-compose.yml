services:
  # PostgreSQL 18 dành cho phát triển bằng Docker
  postgres:
    image: postgres:18-alpine
    container_name: vcraft-postgres
    restart: always
    environment:
      POSTGRES_USER: vcraft_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-vcraft_local_dev_only}"
      POSTGRES_DB: vcraft_nhaxa_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - vcraft_postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcraft_admin -d vcraft_nhaxa_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Hỗ trợ cache thống kê Dashboard cho Admin)
  redis:
    image: redis:7-alpine
    container_name: vcraft-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - vcraft_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin 4 (Giao diện web trực quan quản lý PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vcraft-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vcraft.vn
      PGADMIN_DEFAULT_PASSWORD: admin_password_2026
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  vcraft_postgres18_data:
  vcraft_redis_data:
