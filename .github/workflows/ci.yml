name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vcraft_orm_test_ci
          POSTGRES_USER: vcraft_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcraft_ci -d vcraft_orm_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vcraft_ci:ci_only_password@localhost:5432/vcraft_ci_placeholder?schema=public
      MIGRATION_DATABASE_URL: postgresql://vcraft_ci:ci_only_password@localhost:5432/vcraft_ci_placeholder?schema=public
      ORM_TEST_DATABASE_URL: postgresql://vcraft_ci:ci_only_password@localhost:5432/vcraft_orm_test_ci?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm test
