<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4ef">
  <title>Đăng nhập · vCraft</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/pages/sign-in.page.js"></script>
</head>
<body>
  <main class="sign-in-page">
    <a class="brand" href="/"><img src="/public/favicon.svg" width="38" height="38" alt=""><span>vCraft</span></a>
    <section class="sign-in-card" aria-labelledby="sign-in-title">
      <p class="eyebrow">Sổ tay làng lụa Nha Xá</p>
      <h1 id="sign-in-title">Đăng nhập</h1>
      <form class="account-form" id="sign-in-form" method="post">
        <label id="name-field" hidden>Họ tên<input name="fullName" autocomplete="name" maxlength="120" disabled></label>
        <label><span id="credential-label">Email hoặc tên người dùng</span><input name="identifier" type="text" autocomplete="username" maxlength="255" required></label>
        <label id="username-field" hidden>Tên người dùng (không bắt buộc)<input name="username" autocomplete="off" autocapitalize="none" minlength="3" maxlength="32" disabled></label>
        <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" maxlength="72" required></label>
        <button class="button button-primary" type="submit">Đăng nhập</button>
      </form>
      <form class="account-form" id="reset-request-form" method="post" hidden>
        <label>Email tài khoản<input name="email" type="email" autocomplete="email" maxlength="255" required></label>
        <button class="button button-primary" type="submit">Gửi yêu cầu đặt lại</button>
      </form>
      <form class="account-form" id="reset-confirm-form" method="post" hidden>
        <label>Mật khẩu mới<input name="newPassword" type="password" autocomplete="new-password" maxlength="72" required></label>
        <label>Nhập lại mật khẩu mới<input name="confirmPassword" type="password" autocomplete="new-password" maxlength="72" required></label>
        <button class="button button-primary" type="submit">Đặt lại mật khẩu</button>
      </form>
      <p role="status" aria-live="polite"></p>
      <button class="text-button sign-in-forgot" type="button">Quên mật khẩu?</button>
      <button class="text-button sign-in-toggle" type="button">Tạo tài khoản người mua</button>
      <a class="text-link sign-in-back" href="/">Trở về trang trước</a>
    </section>
  </main>
  <noscript>Hãy bật JavaScript để đăng nhập.</noscript>
</body>
</html>
